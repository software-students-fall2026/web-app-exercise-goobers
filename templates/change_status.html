<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update a Machine – {{ building_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <a href="{{ url_for('machine_in_building', building_name=building_name) }}">&larr; Back to {{ building_name }}</a>
    <h1>Update a Machine in {{ building_name }}</h1>

    <form action="{{ url_for('change_status', building_name=building_name) }}" method="POST">

        <p><strong>What do you want to do?</strong></p>
        <label><input type="radio" name="action" value="claim" checked> Claim a machine</label>
        <label><input type="radio" name="action" value="unclaim"> Unclaim a machine</label>
        <label><input type="radio" name="action" value="broken"> Report a broken machine</label>

        <label for="machine_id">Machine</label>
        <select id="machine_id" name="machine_id" required>
            {% for machine in machines %}
                <option value="{{ machine.machine_id }}" data-status="{{ machine.status }}">
                    {{ machine.machine_id }} ({{ machine.status }})
                </option>
            {% endfor %}
        </select>
        <p id="no-machines" hidden>No machines match this option right now.</p>

        <div id="issue-box" hidden>
            <label for="problem">Explain the issue</label>
            <textarea id="problem" name="problem" rows="4"></textarea>
        </div>

        <button type="submit">Submit</button>
    </form>

    <script>
        // Which machines to show for each choice
        const showFor = {
            claim:   (status) => status === "Available",
            unclaim: (status) => status === "In-Use",
            broken:  (status) => true //bc any machine can be reported as broken
        };

        const select = document.getElementById("machine_id");
        const issueBox = document.getElementById("issue-box");
        const problem = document.getElementById("problem");
        const noMachines = document.getElementById("no-machines");

        function updateForm() {
            const action = document.querySelector('input[name="action"]:checked').value;
            let firstVisible = null;

            for (const option of select.options) {
                const show = showFor[action](option.dataset.status);
                option.hidden = !show;
                option.disabled = !show;
                if (show && !firstVisible) firstVisible = option;
            }

            select.value = firstVisible ? firstVisible.value : "";
            noMachines.hidden = firstVisible !== null;

            const isBroken = action === "broken";
            issueBox.hidden = !isBroken;
            problem.required = isBroken;
        }

        document.querySelectorAll('input[name="action"]').forEach((radio) => {
            radio.addEventListener("change", updateForm);
        });
        updateForm();
    </script>
</body>
</html>
