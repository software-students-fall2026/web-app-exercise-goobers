      
</head>
<body>
    <main class="create-account-container">
        <div class="logo" aria-hidden="true"> [logo] </div>

        <h1>Welcome to Laundry App!</h1>
        <p class="subtitle">
            Create account to manage your laundry and check machine availability.
        </p>

        <form action="/login" method="POST">
            <label for="username">Username</label>
            <input
                type="username"
                id="username"
                name="username"
                placeholder="abc1234"
                autocomplete="email"
                required
            >

            <label for="tel">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="123-456-7890"
                autocomplete="tel"
                required
            >

            <button type="submit">Sign In</button>
        </form>

        <p class="signup">
            Already have an account? <a href="/login">Sign In</a>
        </p>
    </main>
</body>
</html>
