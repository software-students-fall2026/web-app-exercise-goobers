<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
   <a href="/building_home_page" class="back-link">
    &larr; All Buildings
        </a>
    <h1>{{ building_name }} Laundry Room</h1>
    <p>Select a machine to see its current status.</p>
    <!--<p><a href="{{ url_for('change_status', building_name=building_name) }}">Claim, unclaim, or report a machine</a></p>-->

    <main>
        <section class="machine-section">
            <h2>Available Machines</h2>
            <div class="machine-grid">
            {% for machine in machines %}
                <div class="machine-card">
                <h3>Machine {{ machine.machine_id }}</h3>
                <p class="machine-status">
                Status:
                    <span class="status-label
                    {% if machine.status == 'Available' %} available
                    {% elif machine.status == 'In-Use' %} in-use
                    {% elif machine.status == 'Out of Order' %} out-of-order
                    {% endif %}"> {{ machine.status }}
                    </span>
                 </p>
                </div>
                {% else %}
                    <p>No machines found in this building.</p>
                {% endfor %}
            </div>


        </section> 

    </main>

</body>
</html>
