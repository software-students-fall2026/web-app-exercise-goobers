<head>
    <title>Report a Machine Issue</title>
</head>
<body>
    <a href="{{ url_for('home_screen') }}">← Back to home</a>
    <h1>Report a Machine Issue</h1>
    <form action="{{ url_for('admin_machine_form_post') }}" method="POST">
        <label for="machine">Machine</label>
        <select id="machine" name="machine_id" required>
            {% for machine in machines %}
                <option value="{{ machine.machine_id }}">{{ machine.building }} – {{ machine.machine_id }}</option>
            {% endfor %}
        </select>
    
        <label for="building">Building</label>
        <select id="building" name="building" required>
            <option value="Palladium">Palladium</option>
            <option value="Weinstein">Weinstein</option>
            <option value="UHall">UHall</option>
        </select>
    
        <label for="problem">What's wrong?</label>
        <textarea id="problem" name="problem" required></textarea>
    
        <button type="submit">Submit Request</button>
    </form>
</body>
