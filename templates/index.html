<!DOCTYPE html>
<html>
<head>
    <title>Laundry App</title>
</head>
<body>
    <h1>Welcome to Team Goobers Laundry App!</h1>
    <p>Select your building to get started.</p>
    <ul>
        <li><a href="{{ url_for('machine_in_building', building_name='Palladium') }}">Palladium</a></li>
        <li><a href="{{ url_for('machine_in_building', building_name='Weinstein') }}">Weinstein</a></li>
        <li><a href="{{ url_for('machine_in_building', building_name='UHall') }}">UHall</a></li>
    </ul>

    {% if not user %}
        <p>Are you an admin? <a href="{{ url_for('login_page') }}">Sign In Here</a></p>
    {% endif %}
    {% if is_admin %}
        <h2>Admin Tools</h2>
        <a href="{{ url_for('admin_machine_form') }}">Report a Machine Issue</a>
    {% endif %}

</body>
</html>
